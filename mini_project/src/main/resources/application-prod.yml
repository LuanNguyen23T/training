# ===================================================================
# Profile: PROD (Môi trường Production)
# CSDL: MySQL CSDL quan hệ chính thức
# ===================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/employee_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      "[hibernate.format_sql]": false
  h2:
    console:
      # Tắt H2 Web Console trên môi trường Production
      enabled: false

logging:
  level:
    root: WARN
    "[com.sun.training.employeemanagement]": INFO
    "[org.hibernate.SQL]": ERROR
