spring.application.name=employee-management

# Server configuration
server.port=8080

# ===================================================================
# Database Configuration
# ===================================================================
spring.datasource.url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Tắt cảnh báo open-in-view (khuyến nghị cho REST API)
spring.jpa.open-in-view=false

# H2 Web Console (Truy cập tại http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# Cấu hình MySQL (Sử dụng khi kết nối CSDL MySQL thật ở các Module tiếp theo)
# Khi dùng MySQL, bỏ comment các dòng dưới đây và tắt cấu hình H2 ở trên:
# spring.datasource.url=jdbc:mysql://localhost:3306/employee_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.jpa.hibernate.ddl-auto=update
# ===================================================================

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false
