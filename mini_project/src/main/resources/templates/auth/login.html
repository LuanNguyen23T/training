<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Quản Lý Nhân Viên</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M16 7a4.5 4.5 0 100 9 4.5 4.5 0 000-9zm-7.5 16.5c0-3.5 3.5-5.5 7.5-5.5s7.5 2 7.5 5.5V25h-15v-1.5z' fill='%23ffffff'/%3E%3C/svg%3E">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            padding: 1.5rem;
        }
        .auth-card {
            background-color: #ffffff;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .auth-header {
            background: #ffffff;
            padding: 2.25rem 2rem 1.25rem;
            text-align: center;
        }
        .auth-logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            font-size: 1.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            margin-bottom: 1rem;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }
        .auth-body {
            padding: 0 2rem 2.25rem;
        }
        .form-control {
            border-radius: 8px;
            padding: 0.65rem 0.95rem;
            font-size: 0.925rem;
            border: 1px solid #cbd5e1;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-primary {
            background-color: #2563eb;
            border-color: #2563eb;
            font-weight: 600;
            padding: 0.7rem;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
        }
        .input-group > .input-group-text:first-child {
            border-top-left-radius: 8px !important;
            border-bottom-left-radius: 8px !important;
            border-color: #cbd5e1;
        }
        .input-group > .form-control {
            border-top-right-radius: 8px !important;
            border-bottom-right-radius: 8px !important;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h4 class="fw-bold mb-1">Đăng Nhập</h4>
        </div>

        <div class="auth-body">
            <!-- Thông báo thành công -->
            <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center py-2 px-3 small rounded-3" role="alert">
                <i class="bi bi-check-circle-fill me-2 fs-6"></i>
                <span th:text="${successMessage}"></span>
            </div>

            <!-- Thông báo lỗi đăng nhập -->
            <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center py-2 px-3 small rounded-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-secondary">Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Nhập tên đăng nhập" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold text-secondary">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Đăng Nhập
                </button>
            </form>

            <div class="text-center">
                <span class="small text-muted">Chưa có tài khoản? </span>
                <a th:href="@{/register}" class="small text-decoration-none fw-semibold text-primary">Đăng ký ngay</a>
            </div>
        </div>
    </div>
</body>
</html>
