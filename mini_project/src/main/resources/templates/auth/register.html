<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Quản Lý Nhân Viên</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M16 7a4.5 4.5 0 100 9 4.5 4.5 0 000-9zm-7.5 16.5c0-3.5 3.5-5.5 7.5-5.5s7.5 2 7.5 5.5V25h-15v-1.5z' fill='%23ffffff'/%3E%3C/svg%3E">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            padding: 1.5rem;
        }
        .auth-card {
            background-color: #ffffff;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .auth-header {
            background: #ffffff;
            padding: 2.25rem 2rem 1.25rem;
            text-align: center;
        }
        .auth-logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            font-size: 1.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            margin-bottom: 1rem;
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
        }
        .auth-body {
            padding: 0 2rem 2.25rem;
        }
        .form-control {
            border-radius: 8px;
            padding: 0.65rem 0.95rem;
            font-size: 0.925rem;
            border: 1px solid #cbd5e1;
        }
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }
        .btn-success {
            background-color: #10b981;
            border-color: #10b981;
            font-weight: 600;
            padding: 0.7rem;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .btn-success:hover {
            background-color: #059669;
            border-color: #059669;
        }
        .input-group > .input-group-text:first-child {
            border-top-left-radius: 8px !important;
            border-bottom-left-radius: 8px !important;
            border-color: #cbd5e1;
        }
        .input-group > .form-control {
            border-top-right-radius: 8px !important;
            border-bottom-right-radius: 8px !important;
        }
        #username {
            padding-right: 2.5rem;
        }
        #username.is-invalid, #username.is-valid {
            background-image: none !important;
        }
        .username-status-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            pointer-events: none;
            display: none;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h4 class="fw-bold mb-1">Đăng Ký Tài Khoản</h4>
        </div>

        <div class="auth-body">
            <!-- Thông báo lỗi từ server nếu có -->
            <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center py-2 px-3 small rounded-3 mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/register}" th:object="${registerDto}" method="post" id="registerForm" novalidate>
                <!-- Tên đăng nhập -->
                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-secondary">Tên đăng nhập</label>
                    <div class="input-group position-relative">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                        <input type="text"
                               class="form-control"
                               th:field="*{username}"
                               id="username"
                               placeholder="Nhập tên đăng nhập"
                               required
                               autofocus
                               autocomplete="off">
                        <span class="username-status-icon" id="usernameStatusIcon"></span>
                    </div>
                    <!-- Feedback trạng thái tên đăng nhập -->
                    <div id="usernameFeedback" class="small mt-1" style="display: none;"></div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <!-- Mật khẩu -->
                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold text-secondary">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                        <input type="password"
                               class="form-control"
                               th:field="*{password}"
                               id="password"
                               placeholder="Nhập mật khẩu"
                               required>
                    </div>
                    <!-- Feedback mật khẩu -->
                    <div id="passwordFeedback" class="text-danger small mt-1" style="display: none;"></div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <!-- Nút Đăng ký (không có icon tick) -->
                <button type="submit" class="btn btn-success w-100 mb-3" id="submitBtn">
                    Đăng Ký
                </button>
            </form>

            <div class="text-center">
                <span class="small text-muted">Đã có tài khoản? </span>
                <a th:href="@{/login}" class="small text-decoration-none fw-semibold text-primary">Đăng nhập ngay</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameStatusIcon = document.getElementById('usernameStatusIcon');
            const usernameFeedback = document.getElementById('usernameFeedback');
            const passwordFeedback = document.getElementById('passwordFeedback');
            const registerForm = document.getElementById('registerForm');

            let isUsernameValid = false;

            // Kiểm tra username khi rời khỏi ô nhập (Tab / Blur) hoặc khi nhập
            async function checkUsernameAvailability() {
                const username = usernameInput.value.trim();

                if (username.length === 0) {
                    hideUsernameStatus();
                    isUsernameValid = false;
                    return;
                }

                if (username.length < 3 || username.length > 50) {
                    showUsernameError('Tên đăng nhập phải từ 3 đến 50 ký tự');
                    isUsernameValid = false;
                    return;
                }

                try {
                    const response = await fetch('/api/v1/auth/check-username?username=' + encodeURIComponent(username));
                    if (response.ok) {
                        const data = await response.json();
                        if (data.exists) {
                            showUsernameError('Tên đăng nhập này đã tồn tại');
                            isUsernameValid = false;
                        } else {
                            showUsernameSuccess('Tên đăng nhập hợp lệ');
                            isUsernameValid = true;
                        }
                    }
                } catch (err) {
                    console.error('Lỗi khi kiểm tra tên đăng nhập:', err);
                }
            }

            function showUsernameError(message) {
                usernameStatusIcon.style.display = 'flex';
                usernameStatusIcon.innerHTML = '<i class="bi bi-x-circle-fill text-danger fs-6"></i>';
                usernameInput.classList.remove('is-valid');
                usernameInput.classList.add('is-invalid');
                usernameFeedback.style.display = 'block';
                usernameFeedback.className = 'small mt-1 text-danger';
                usernameFeedback.textContent = message;
            }

            function showUsernameSuccess(message) {
                usernameStatusIcon.style.display = 'flex';
                usernameStatusIcon.innerHTML = '<i class="bi bi-check-circle-fill text-success fs-6"></i>';
                usernameInput.classList.remove('is-invalid');
                usernameInput.classList.add('is-valid');
                usernameFeedback.style.display = 'block';
                usernameFeedback.className = 'small mt-1 text-success';
                usernameFeedback.textContent = message;
            }

            function hideUsernameStatus() {
                usernameStatusIcon.style.display = 'none';
                usernameInput.classList.remove('is-valid', 'is-invalid');
                usernameFeedback.style.display = 'none';
            }

            // Gọi kiểm tra khi blur (nhấn Tab ra ngoài) hoặc sau khi gõ xong
            usernameInput.addEventListener('blur', checkUsernameAvailability);
            usernameInput.addEventListener('input', function() {
                if (usernameInput.value.trim().length === 0) {
                    hideUsernameStatus();
                    isUsernameValid = false;
                }
            });

            // Kiểm tra mật khẩu
            function checkPasswordValidity() {
                const password = passwordInput.value;
                if (!password || password.length < 6) {
                    passwordInput.classList.remove('is-valid');
                    passwordInput.classList.add('is-invalid');
                    passwordFeedback.style.display = 'block';
                    passwordFeedback.textContent = 'Mật khẩu phải có tối thiểu 6 ký tự';
                    return false;
                } else {
                    passwordInput.classList.remove('is-invalid');
                    passwordInput.classList.add('is-valid');
                    passwordFeedback.style.display = 'none';
                    return true;
                }
            }

            passwordInput.addEventListener('blur', checkPasswordValidity);
            passwordInput.addEventListener('input', function() {
                if (passwordInput.value.length >= 6) {
                    passwordInput.classList.remove('is-invalid');
                    passwordInput.classList.add('is-valid');
                    passwordFeedback.style.display = 'none';
                }
            });

            // Khi submit form: Kiểm tra toàn bộ yêu cầu, nếu sai bắt nhập lại
            registerForm.addEventListener('submit', async function (e) {
                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                let hasError = false;

                // Kiểm tra tên đăng nhập
                if (username.length < 3 || username.length > 50) {
                    showUsernameError('Tên đăng nhập phải từ 3 đến 50 ký tự');
                    hasError = true;
                } else if (!isUsernameValid) {
                    // Kiểm tra trực tiếp lần nữa nếu chưa kiểm tra
                    const response = await fetch('/api/v1/auth/check-username?username=' + encodeURIComponent(username));
                    if (response.ok) {
                        const data = await response.json();
                        if (data.exists) {
                            showUsernameError('Tên đăng nhập này đã tồn tại');
                            hasError = true;
                        }
                    }
                }

                // Kiểm tra mật khẩu
                if (!checkPasswordValidity()) {
                    hasError = true;
                }

                if (hasError) {
                    e.preventDefault();
                    if (usernameInput.classList.contains('is-invalid')) {
                        usernameInput.focus();
                    } else if (passwordInput.classList.contains('is-invalid')) {
                        passwordInput.focus();
                    }
                }
            });
        });
    </script>
</body>
</html>
