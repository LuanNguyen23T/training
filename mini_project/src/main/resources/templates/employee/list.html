<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh Sách Nhân Viên')}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar('list')}"></nav>

    <main class="main-content container">
        <!-- Thông báo Flash Attributes -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border d-flex align-items-center mb-4" role="alert">
            <i class="bi bi-check-circle-fill fs-5 me-2 text-success"></i>
            <span th:text="${successMessage}">Thao tác thành công!</span>
            <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
        </div>

        <!-- Header Card & Bộ lọc nhanh -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
                    <div>
                        <h4 class="fw-bold mb-1 text-dark">
                            <i class="bi bi-people-fill text-primary me-2"></i>Danh Sách Nhân Viên
                        </h4>
                        <p class="text-muted mb-0 small">Theo dõi và quản lý hồ sơ nhân viên trong tổ chức</p>
                    </div>
                    <div>
                        <a th:href="@{/employees/add}" class="btn btn-primary">
                            <i class="bi bi-person-plus-fill me-1"></i> Thêm Nhân Viên Mới
                        </a>
                    </div>
                </div>

                <!-- Form lọc nhanh -->
                <form th:action="@{/employees/list}" method="get" class="row g-2 align-items-center pt-2 border-top">
                    <div class="col-md-5">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" name="keyword" th:value="${keyword}" class="form-control bg-light border-start-0"
                                   placeholder="Tìm theo tên, mã NV hoặc email...">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select name="department" class="form-select bg-light">
                            <option value="">-- Tất cả phòng ban --</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept}"
                                    th:text="${dept}"
                                    th:selected="${dept == selectedDepartment}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-dark flex-grow-1">
                            <i class="bi bi-funnel me-1"></i> Lọc
                        </button>
                        <a th:href="@{/employees/list}" class="btn btn-outline-secondary" title="Đặt lại">
                            <i class="bi bi-arrow-counterclockwise"></i>
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Bảng danh sách nhân viên -->
        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">
                                    Mã NV <i class="bi bi-sort-numeric-down text-primary ms-1" title="Sắp xếp tăng dần theo Mã NV"></i>
                                </th>
                                <th>Họ và Tên</th>
                                <th>Email</th>
                                <th>Phòng Ban</th>
                                <th class="text-end">Mức Lương</th>
                                <th class="text-center pe-4" style="min-width: 170px;">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(employees)}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <div class="py-3">
                                        <i class="bi bi-folder-x fs-1 d-block mb-2 text-secondary opacity-50"></i>
                                        <p class="mb-0 fw-medium">Không tìm thấy nhân viên nào phù hợp.</p>
                                    </div>
                                </td>
                            </tr>
                            <tr th:each="emp : ${employees}">
                                <td class="ps-4">
                                    <span class="badge bg-light text-primary border font-monospace px-2 py-1"
                                          th:text="${emp.employeeCode}">N0001</span>
                                </td>
                                <td>
                                    <span class="fw-semibold text-dark" th:text="${emp.fullName}">Nguyễn Văn A</span>
                                </td>
                                <td>
                                    <a th:href="'mailto:' + ${emp.email}" class="text-decoration-none text-muted" th:text="${emp.email}">email@sun-asterisk.com</a>
                                </td>
                                <td>
                                    <span class="badge bg-light text-secondary border fw-normal" th:text="${emp.department}">Engineering</span>
                                </td>
                                <td class="text-end fw-semibold text-dark"
                                    th:text="${emp.salary != null ? #numbers.formatDecimal(emp.salary, 0, 'COMMA', 0, 'POINT') + ' ₫' : 'Chưa có'}">
                                    15,000,000 ₫
                                </td>
                                <td class="text-center pe-4">
                                    <div class="d-inline-flex gap-1" role="group">
                                        <!-- Nút Sửa -->
                                        <a th:href="@{/employees/edit/{code}(code=${emp.employeeCode})}"
                                           class="btn btn-outline-primary btn-sm"
                                           title="Sửa thông tin">
                                            <i class="bi bi-pencil-square me-1"></i>Sửa
                                        </a>
                                        <!-- Nút Xóa -->
                                        <a th:href="@{/employees/delete/{code}(code=${emp.employeeCode})}"
                                           class="btn btn-outline-danger btn-sm"
                                           onclick="return confirm('Bạn có chắc chắn muốn xóa nhân viên này không?');"
                                           title="Xóa nhân viên">
                                            <i class="bi bi-trash me-1"></i>Xóa
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white border-top text-muted small ps-4 py-3">
                <span>Tổng số nhân sự: <strong class="text-dark" th:text="${#lists.size(employees)}">0</strong></span>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
