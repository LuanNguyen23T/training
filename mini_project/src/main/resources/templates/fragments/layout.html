<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Quản Lý Nhân Viên'">Quản Lý Nhân Viên</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bs-primary: #2563eb;
            --bs-primary-rgb: 37, 99, 235;
        }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background-color: #0f172a !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
        }
        .nav-link {
            font-weight: 500;
            font-size: 0.925rem;
            color: #94a3b8 !important;
            padding: 0.5rem 0.9rem !important;
            border-radius: 6px;
            transition: all 0.15s ease-in-out;
        }
        .nav-link:hover {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.06);
        }
        .nav-link.active {
            color: #ffffff !important;
            background-color: rgba(37, 99, 235, 0.35);
            font-weight: 600;
        }
        .main-content {
            flex: 1;
            padding-top: 2rem;
            padding-bottom: 3.5rem;
        }
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: none;
            overflow: hidden;
            background-color: #ffffff;
        }
        .card-header {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 1.25rem;
        }
        .card-body {
            padding: 1.25rem;
        }
        .btn {
            font-weight: 500;
            border-radius: 6px;
            padding: 0.4rem 0.85rem;
            font-size: 0.875rem;
            transition: all 0.15s ease-in-out;
        }
        .btn-primary {
            background-color: #2563eb;
            border-color: #2563eb;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
        }
        .table {
            margin-bottom: 0;
        }
        .table > :not(caption) > * > * {
            padding: 0.85rem 1rem;
        }
        .table thead th {
            background-color: #f8fafc;
            font-size: 0.775rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            font-weight: 600;
            border-bottom: 1px solid #e2e8f0;
            border-top: none;
        }
        .table tbody td {
            border-bottom: 1px solid #f1f5f9;
        }
        .table tbody tr:last-child td {
            border-bottom: none;
        }
        .badge {
            font-weight: 500;
            padding: 0.35rem 0.6rem;
            border-radius: 6px;
        }
        footer {
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 1.25rem 0;
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
        }
        .dev-badge {
            display: inline-flex;
            align-items: center;
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 0.2rem 0.55rem;
            font-size: 0.775rem;
            text-decoration: none;
            transition: background 0.15s;
        }
        .dev-badge:hover {
            background-color: #e2e8f0;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <!-- Navbar Fragment -->
    <nav th:fragment="navbar(activeTab)" class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center text-white" th:href="@{/employees/list}">
                <div class="bg-primary text-white rounded-2 d-flex align-items-center justify-content-center me-2" style="width: 32px; height: 32px;">
                    <i class="bi bi-people-fill"></i>
                </div>
                <span>Quản Lý Nhân Viên</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-1">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeTab == 'list'} ? ' active' : ''" th:href="@{/employees/list}">
                            <i class="bi bi-table me-1"></i> Danh Sách
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeTab == 'add'} ? ' active' : ''" th:href="@{/employees/add}">
                            <i class="bi bi-person-plus me-1"></i> Thêm Mới
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeTab == 'search'} ? ' active' : ''" th:href="@{/employees/search}">
                            <i class="bi bi-search me-1"></i> Tìm Kiếm
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Footer Fragment -->
    <footer th:fragment="footer">
        <div class="container text-center">
            <span>&copy; 2026 Employee Management</span>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </footer>
</body>
</html>
